- service: arista.studio.v1.StudioConfigService
  method: Set
  body:
    value:
      key:
        studio_id: edc1d0de-df53-498d-b7ca-b464efcbcef8
        workspace_id: ''
      created_at: '2026-09-09T14:56:59.733Z'
      created_by: tmaurer
      last_modified_at: '2026-09-09T17:53:10.994Z'
      last_modified_by: tmaurer
      display_name: CUSTOM Management IP
      description: Custom Studio that assigns Management IPs to devices. tmaurer 20260909
      template:
        type: TEMPLATE_TYPE_MAKO
        body: |
          <%
          import ipaddress

          def _s(v):
              return str(v).strip() if v is not None else ""

          ## ---------------------------------------------------------------- ##
          ## -1. Safe access to top-level studio inputs. ##
          ## Inputs are passed as **ctx.studio.inputs; a key that has no ##
          ## value at all is simply absent, and the bare name evaluates to ##
          ## Mako's UNDEFINED (which is NOT None -- `is not None` does not ##
          ## catch it). `context` is Mako's own reserved name and.get() ##
          ## returns the default for a missing key. ##
          ## ---------------------------------------------------------------- ##
          def _inp(name, default=None):
              try:
                  val = context.get(name, default)
              except Exception:
                  return default
              ## UNDEFINED raises on __str__ but is otherwise a plain object;
              ## treat anything that is not the expected shape as absent.
              if val is None or val.__class__.__name__ == "Undefined":
                  return default
              return val

          def _group(name):
              """A group input, or None if it is missing/empty/not a mapping."""
              g = _inp(name)
              return g if (g and hasattr(g, "get")) else None

          ## EOS reserves these names; `vrf instance default` / `vrf instance main` are
          ## invalid. The form no longer offers "default", so this is only a safety net
          ## for rows written outside the UI or left over from the old schema.
          _RESERVED_VRFS = ("default", "main")

          ## ---------------------------------------------------------------- ##
          ## 0. deviceId -> hostname, for human-readable messages only ##
          ## ---------------------------------------------------------------- ##
          _hostCache = {}
          def hostName(devId):
              if devId not in _hostCache:
                  name = ""
                  try:
                      devs = ctx.topology.getDevices(deviceIds=[devId])
                      if devs:
                          name = _s(devs[0].hostName)
                  except Exception:
                      name = ""
                  ## fall back to the ID if the device has no hostname in I&T
                  _hostCache[devId] = name or devId
              return _hostCache[devId]

          def usableRange(gw, plen, label):
              """Subnet and first/last usable host implied by the gateway + prefix length."""
              plen = int(plen)
              if plen > 31:
                  raise ValueError(
                      "%s: prefix length /%d cannot contain a gateway; use /31 or shorter" % (label, plen))
              net = ipaddress.ip_network(u"%s/%d" % (gw, plen), strict=False)
              if plen == 31:
                  first, last = net[0], net[1] # RFC 3021 point-to-point
              else:
                  first, last = net[1], net[-2] # exclude network + broadcast
              gwAddr = ipaddress.ip_address(u"%s" % gw)
              if not (first <= gwAddr <= last):
                  raise ValueError(
                      "%s: gateway %s is not a usable host address in %s (valid %s - %s)"
                      % (label, gw, net, first, last))
              return net, first, last, gwAddr

          def checkInRange(ip, net, first, last, gwAddr, who, label):
              addr = ipaddress.ip_address(u"%s" % ip)
              if addr not in net:
                  raise ValueError("%s: %s is outside the %s subnet %s (valid %s - %s)"
                                   % (who, ip, label, net, first, last))
              if not (first <= addr <= last):
                  raise ValueError("%s: %s is the network or broadcast address of %s; "
                                   "valid host range is %s - %s" % (who, ip, net, first, last))
              if addr == gwAddr:
                  raise ValueError("%s: %s is the %s default gateway and cannot also be a device address"
                                   % (who, ip, label))

          ## ---------------------------------------------------------------- ##
          ## 1. Global per-type management blocks (both optional). ##
          ## The VRF field is optional: empty means the default VRF. ##
          ## ---------------------------------------------------------------- ##
          blocks = {}
          _g = _group("inbandManagementNetworkSettings")
          if _g:
              blocks["Inband"] = {
                  "intf": _s(_g.get("inbandInterfaceName")),
                  "vrf": _s(_g.get("inbandVrf")),
                  "plen": _g.get("inbandPrefixLength"),
                  "gw": _s(_g.get("inbandGateway")),
              }
          _g = _group("oobManagementNetworkSettings")
          if _g:
              blocks["OOB"] = {
                  "intf": _s(_g.get("oobInterfaceName")),
                  "vrf": _s(_g.get("oobVrf")),
                  "plen": _g.get("oobPrefixLength"),
                  "gw": _s(_g.get("oobGateway")),
              }

          _ranges = {}
          def _rangeFor(t, blocks=blocks, cache=_ranges):
              if t not in cache:
                  b = blocks.get(t)
                  if not b:
                      raise ValueError("No global settings group filled in for Type '%s'" % t)
                  if not b["intf"]:
                      raise ValueError("No interface name configured for Type '%s'" % t)
                  if b["plen"] in (None, ""):
                      raise ValueError("No prefix length configured for Type '%s'" % t)
                  if not b["gw"]:
                      raise ValueError("No default gateway configured for Type '%s'" % t)
                  ## note: VRF is deliberately NOT validated here -- it is optional.
                  cache[t] = usableRange(b["gw"], b["plen"], "Type '%s'" % t)
              return cache[t]

          ## ---------------------------------------------------------------- ##
          ## 2. Walk the resolver, if there is one. ##
          ## An unused studio (no rows at all) leaves the resolver input ##
          ## absent, and an emptied resolver arrives as a plain empty ##
          ## list -- neither has.resolveAll(). Both mean "nothing to do". ##
          ## ---------------------------------------------------------------- ##
          myId = ctx.getDevice().id
          problems = {} # deviceId -> [messages]
          owners = {} # ip -> [deviceId]
          mine = None # (ip, type) for this device

          def addProblem(devId, msg, problems=problems):
              problems.setdefault(devId, [])
              if msg not in problems[devId]:
                  problems[devId].append(msg)

          _resolver = _inp("device")
          if not hasattr(_resolver, "resolveAll"):
              _resolver = None

          if _resolver is not None:
              for devId, inputs in _resolver.resolveAll(strict=True):
                  grp = inputs.get("ipSettings") if inputs else None
                  if not grp:
                      continue # no row -> device not managed
                  ip = _s(grp.get("ipAddress"))
                  typ = _s(grp.get("type"))
                  if not ip and not typ:
                      continue # blank row -> ignored
                  who = hostName(devId)
                  if not ip:
                      addProblem(devId, "%s: Type '%s' set but IPv4 Address is empty" % (who, typ))
                      continue
                  if not typ:
                      addProblem(devId, "%s: IPv4 Address %s set but Type is empty "
                                        "(expected Inband or OOB)" % (who, ip))
                      continue
                  if typ not in ("Inband", "OOB"):
                      addProblem(devId, "%s: IPv4 %s has Type '%s' (expected Inband or OOB)"
                                        % (who, ip, typ))
                      continue

                  owners.setdefault(ip, [])
                  if devId not in owners[ip]:
                      owners[ip].append(devId)
                  if devId == myId:
                      mine = (ip, typ)

                  ## Range / gateway / global-settings errors are charged only to this device,
                  ## i.e. only to devices that actually use this Type.
                  try:
                      net, first, last, gwAddr = _rangeFor(typ)
                      checkInRange(ip, net, first, last, gwAddr, who, typ)
                  except ValueError as e:
                      addProblem(devId, str(e))

          ## A duplicate is an error on every device that shares the address, and the
          ## message names all of them.
          for ip, devs in sorted(owners.items()):
              if len(devs) > 1:
                  names = sorted(hostName(d) for d in devs)
                  for d in devs:
                      addProblem(d, "duplicate IPv4 address %s used by: %s" % (ip, ", ".join(names)))

          ## Fail ONLY if this device is one of the offenders.
          myProblems = problems.get(myId)
          if myProblems:
              msg = "Management IP validation failed -- " + "; ".join(myProblems)
              ctx.error(msg)
              assert False, msg

          ## Other devices' problems: log them here so they are visible on
          ## Review Workspace -> Build Details, but do not fail this device.
          for devId, msgs in problems.items():
              if devId!= myId:
                  ctx.info("Management IP validation failed on %s -- %s"
                           % (hostName(devId), "; ".join(msgs)))

          ## ---------------------------------------------------------------- ##
          ## 3. This device (may legitimately have no row -> empty configlet) ##
          ## ---------------------------------------------------------------- ##
          myIp, myType = mine if mine else ("", "")

          intf = vrf = gw = ""
          plen = None
          if myIp and myType in blocks:
              b = blocks[myType]
              intf, vrf, plen, gw = b["intf"], b["vrf"], int(b["plen"]), b["gw"]

          ## No VRF selected -> default VRF: no `vrf instance`, no interface `vrf`,
          ## no `vrf` keyword in the static route.
          useVrf = bool(vrf)
          if useVrf and vrf.lower() in _RESERVED_VRFS:
              ctx.info("Type '%s': VRF name '%s' is reserved in EOS; treating as the default VRF"
                       % (myType, vrf))
              useVrf = False

          ## Set to True only for a dataplane (routed) VRF. Leave False for a pure
          ## management VRF, which has routing disabled by design. Ignored when no
          ## VRF is selected.
          enableVrfRouting = False
          %>\
          % if myIp and intf:
          % if useVrf:
          vrf instance ${vrf}
          !
          % if enableVrfRouting:
          ip routing vrf ${vrf}
          !
          % endif
          % endif
          interface ${intf}
          % if useVrf:
             vrf ${vrf}
          % endif
             ip address ${myIp}/${plen}
          !
          % if useVrf:
          ip route vrf ${vrf} 0.0.0.0/0 ${gw}
          % else:
          ip route 0.0.0.0/0 ${gw}
          % endif
          % endif
